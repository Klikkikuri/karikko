name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version without the tag's `v`
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - name: Build the wheel
        run: uv build
      # The image is amd64 only: the wheel is architecture-independent, the e2e runs amd64 CI. Remove setup-qemu
      # when arm64 leaves the plan; add the platform there when arm64 enters it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/karikko-${{ env.VERSION }}-py3-none-any.whl
      - name: Print the image digest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ env.VERSION }}
