name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  package:
    uses: ./.github/workflows/python-package.yml
  build:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - name: Build the wheel
        run: uv build
      - name: Check the wheel metadata
        run: |
          unzip -p dist/karikko-*.whl '*/METADATA' > /tmp/metadata.txt
          suola=$(sed -n 's|.*"suola @ \(https://[^"]*\)".*|\1|p' pyproject.toml)
          niitti=$(sed -n 's|.*"niitti\[all\] @ \(git+[^"]*\)".*|\1|p' pyproject.toml)
          test -n "$suola" && test -n "$niitti" || { echo "pyproject.toml does not name both direct references"; exit 1; }
          grep -F "Requires-Dist: suola @ $suola" /tmp/metadata.txt
          grep -F "Requires-Dist: niitti[all] @ $niitti" /tmp/metadata.txt
