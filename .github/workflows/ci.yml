name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      # The packaged base rules must follow the suola tag in pyproject.toml, exactly. The committed file carries a
      # three-line provenance header; compare the copy's body against the suola source.
      - name: Check the base-rules copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/Klikkikuri/suola/v0.7.0/rules.yaml -o /tmp/rules.yaml
          tail -n +4 src/karikko/base_rules.yaml > /tmp/base-rules-body.yaml
          diff /tmp/base-rules-body.yaml /tmp/rules.yaml
      - name: Test on Python 3.12
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          uv python install 3.12
          uv sync --frozen --group dev
          uv run pytest -q
      - name: Build the wheel
        run: uv build
      - name: Check the wheel metadata
        run: |
          unzip -p dist/karikko-*.whl '*/METADATA' > /tmp/metadata.txt
          rg -F "Requires-Dist: suola @ https://github.com/Klikkikuri/suola/releases/download/v0.7.0/suola-0.7.0-py3-none-any.whl" /tmp/metadata.txt
          rg -F "Requires-Dist: niitti[all] @ git+https://github.com/Klikkikuri/Niitti@09333ed0b8498ab8a9149ee60295a6818aff93f0" /tmp/metadata.txt
