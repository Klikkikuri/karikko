name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  package:
    uses: ./.github/workflows/python-package.yml
  build:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - name: Build the wheel
        run: uv build
      - name: Check the wheel metadata
        run: |
          unzip -p dist/karikko-*.whl '*/METADATA' > /tmp/metadata.txt
          grep -F "Requires-Dist: suola @ https://github.com/Klikkikuri/suola/releases/download/v0.7.0/suola-0.7.0-py3-none-any.whl" /tmp/metadata.txt
          grep -F "Requires-Dist: niitti[all] @ git+https://github.com/Klikkikuri/Niitti@09333ed0b8498ab8a9149ee60295a6818aff93f0" /tmp/metadata.txt
