name: Python package
# The reusable package pipeline. Called by this repository's own `ci.yml` (relative `uses:`), and by other
# repositories of the org — meri first — with their own checkout as the source tree (`workflow_call` only;
# the plan's decision on how the Python packages share CI). No floating anywhere: a caller pinning `@main`
# runs exactly what `main` holds when the pipeline fires.

on:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      # The packaged base rules must follow the suola tag in pyproject.toml, exactly. The committed file
      # carries a three-line provenance header; compare the copy's body against the suola source.
      - name: Check the base-rules copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/Klikkikuri/suola/v0.7.0/rules.yaml -o /tmp/rules.yaml
          tail -n +4 src/karikko/base_rules.yaml > /tmp/base-rules-body.yaml
          diff /tmp/base-rules-body.yaml /tmp/rules.yaml
      - name: Test on Python 3.12
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          uv python install 3.12
          uv sync --frozen --group dev
          uv run pytest -q
