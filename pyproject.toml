[project]
name = "karikko"
version = "0.1.0"
description = "Development server for Klikkikuri Paatti: the Ilta-Pulu test news site, local provider manifests, and fault injection"
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "Klikkikuri" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "jinja2>=3.1",
    "faker>=38",
    # Direct references, so that the wheel resolves without `[tool.uv.sources]`. Network access at install time;
    # the image is the offline artifact (README). Update `src/karikko/base_rules.yaml` with the suola tag.
    "suola @ https://github.com/Klikkikuri/suola/releases/download/v0.7.0/suola-0.7.0-py3-none-any.whl",
    # `logging` needs the `tracing` extra, and `settings` imports yaml: Klikkikuri/Niitti#3, #4.
    "niitti[all] @ git+https://github.com/Klikkikuri/Niitti@09333ed0b8498ab8a9149ee60295a6818aff93f0",
    "pyyaml>=6",
]

[project.scripts]
karikko = "karikko.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "beautifulsoup4>=4.13",
    "soupsieve>=2.8",
    "html5lib>=1.1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
